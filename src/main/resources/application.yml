server:
  port: 8080
  servlet:
    # 应用上下文路径。保持 / 表示接口直接从根路径开始。
    context-path: /

spring:
  application:
    # 应用名称，会出现在日志、监控或服务注册信息中。
    name: FlowTicket

  # 数据库连接配置。
  datasource:
    url: jdbc:mysql://localhost:3306/flow_ticket?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 是 Spring Boot 默认连接池，负责复用数据库连接。
    hikari:
      # 最小空闲连接数。
      minimum-idle: 5
      # 连接池最大连接数。
      maximum-pool-size: 20
      # SQL 执行后自动提交事务，简单 CRUD 默认保持 true。
      auto-commit: true
      # 空闲连接最长保留时间，单位毫秒。
      idle-timeout: 30000
      # 连接池名称，方便在日志中识别。
      pool-name: FlowTicketHikariCP
      # 单个连接最长生命周期，单位毫秒。
      max-lifetime: 1800000
      # 获取连接的最长等待时间，单位毫秒。
      connection-timeout: 30000

  servlet:
    multipart:
      # 开启文件上传能力。
      enabled: true
      # 单个上传文件最大大小。
      max-file-size: 20MB
      # 单次请求最大大小，包含所有文件和表单字段。
      max-request-size: 50MB

  jackson:
    # JSON 中日期时间的默认格式。
    date-format: yyyy-MM-dd HH:mm:ss
    # JSON 序列化/反序列化使用的时区。
    time-zone: Asia/Shanghai

# MyBatis 配置
mybatis:
  # XML Mapper 文件位置。原生 MyBatis 的 SQL 写在这些 XML 文件里。
  mapper-locations: classpath*:/mapper/**/*.xml
  # 实体类所在包，便于 MyBatis 在 XML 中使用类型别名。
  type-aliases-package: com.onik.flowticket.entity

  configuration:
    # 开启下划线转驼峰映射，例如 real_name 自动映射到 realName。
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，开发调试方便；生产环境可关闭或调低日志级别。
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j/OpenAPI 接口文档配置
springdoc:
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

# PageHelper 分页插件配置
pagehelper:
  # 指定数据库方言，PageHelper 会按 MySQL 语法生成 limit 分页 SQL。
  helper-dialect: mysql
  # pageNum 小于 1 时查询第一页，大于总页数时查询最后一页。
  reasonable: true
  # 允许通过 Mapper 方法参数识别分页参数；当前代码主要使用 PageHelper.startPage。
  support-methods-arguments: true

# 日志级别配置
logging:
  level:
    # 项目自身包使用 debug，方便开发时查看业务日志。
    com.onik.flowticket: debug
    # Spring 框架日志保持 info，避免控制台过于嘈杂。
    org.springframework: info
    # MyBatis 日志使用 debug，方便观察 SQL 和执行过程。
    org.mybatis: debug
